# Finch example configuration.
#
# Copy this file to `finch.yaml` and adjust it for your setup. `finch.yaml` is
# git-ignored so local credentials and repository lists are not committed.

# List explicit repositories as `owner/name`. Leave empty to use repository_discovery.
# repositories:
#   - your-org/your-repo
#   - your-org/another-repo
repositories: []

repository_discovery:
  enabled: true
  lookback_hours: 24
  max_repos: 10

twitter:
  daily_limit: 100
  per_query_limit: 20
  queries:
    - id: agent_harness_live
      text: '"agent harness" OR "agent loop"'
      filter: live
      priority: 5
    - id: agent_eval_live
      text: '"agent evals" OR "trajectory evaluation"'
      filter: live
      priority: 5
    - id: context_engineering
      text: '"context engineering" agent'
      filter: live
      priority: 4
    - id: tool_failure
      text: '"tool calling" failure agent'
      filter: live
      priority: 4
  high_value_authors: []
  blocked_authors: []

quality_gates:
  max_daily_replies: 5
  max_daily_original_posts: 1
  min_candidate_score: 0.65
  min_evidence_score: 0.75
  min_quality_score: 0.75
  min_discussability: 0.50
  max_rewrite_rounds: 2
  match_top_k: 10
  timing_default: 0.3

engagement:
  enabled: true
  schedule: every_run
  platforms: [x, reddit]
  max_posts_scanned: 30
  min_candidate_score: 0.72
  max_bookmarks: 5
  max_reply_drafts: 3
  max_public_replies: 2
  per_author_daily_limit: 1
  public_expression_requires_approval: true

interests:
  stable:
    - agent reliability
    - agent evals
    - graph engineering
    - agent harness
  exploring:
    - durable execution
    - failure replay
    - dynamic graph
    - production agent failures
  excluded:
    - AI news
    - funding and valuation
    - evidence-free model rankings

# api_key is read from LLM_API_KEY in .env; do not commit secrets here.
llm:
  base_url: https://your-llm-gateway.example.com/v1
  model: your-model-name
  nodes:
    plan_topics:
      model: your-model-name
      timeout_seconds: 300
    expand_job:
      model: your-model-name
      timeout_seconds: 240
      max_concurrency: 4
    critique:
      model: your-model-name
      timeout_seconds: 300
      max_output_tokens: 4096

extraction:
  max_prompt_bytes: 50000
  max_groups_per_batch: 12
  max_concurrent_batches: 2
  timeout_seconds: 180

daily_budget:
  max_detail_fetches: 40
  max_change_groups: 12
  max_planning_events: 12
  max_evidence_cards_for_planning: 36
  max_estimated_prompt_bytes: 40000
  age_bonus_max_days: 7
  max_extract_retries: 3
  sort_weights:
    core_source: 0.25
    churn: 0.20
    keyword: 0.15
    cross_module: 0.10
    novelty: 0.15
    age_bonus: 0.15
