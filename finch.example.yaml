# Finch example configuration.
#
# Copy this file to `finch.yaml` and adjust it for your setup. `finch.yaml` is
# git-ignored so local credentials and repository lists are not committed.

# List explicit repositories as `owner/name`. Leave empty to use repository_discovery.
# repositories:
#   - your-org/your-repo
#   - flingjie/Agent-100-Days
#   - flingjie/InvestAI
repositories: []

repository_discovery:
  enabled: true
  lookback_hours: 24
  max_repos: 10

# X 上分享的 GitHub 仓库热度榜（与上面「用户自有仓库发现」无关）
repo_discovery:
  enabled: true
  timezone: Asia/Shanghai
  lookback_hours: 24
  collect_all: true
  default_view: all
  default_sort: x_heat
  page_size: 50
  queries:
    - "github.com has:links -filter:nativeretweets"
    - '("agent" OR "agentic" OR harness) github.com has:links'
  ranking:
    likes_weight: 1
    reposts_weight: 2
    quotes_weight: 2
    replies_weight: 1
  agent_tags:
    enabled: true
    keywords:
      - agent
      - agentic
      - harness
      - tool calling
      - multi-agent
  execution:
    resumable: true
    per_slice_budget_seconds: 600
    per_query_limit: 100
    expand_short_urls: false

paths:
  # 用户真实实践清单（finch profile ...）；只有 confirmed: true 的条目进入机会评估与贡献制作。
  practice_profile_path: practice-profile.yaml

opencli:
  profile: work
  format: json
  command_timeout_seconds: 60
  browser_connect_timeout_seconds: 45
  max_parallel_local: 3
  max_parallel_browser: 1
  allow_write_commands: false

# Per-source discovery queries for `connect daily --refresh` / `sources sync --all`.
# Each source is explicit: `enabled` + `mode` (query | hot | url | disabled).
# An `enabled: true` source with `mode: query`/`url` but no queries/urls is a
# CONFIG_ERROR (never silently skipped). Do NOT reuse one topic query for GitHub
# (users are logins, not themes).
sources:
  twitter:
    enabled: true
    mode: query
    fetch_limit: 200
    queries:
      - '"agent reliability" OR "agent evals"'                 # Agent 工程（保留为一组）
      - '("indie maker" OR bootstrapped) (lessons OR mistakes)'
      - '("learning in public" OR "deliberate practice")'
      - '("writing process" OR "clear writing")'
      - '("decision making" OR "changed my mind")'
      - '("creative process" OR "design process")'
    urls: []
  reddit:
    enabled: true
    mode: query
    fetch_limit: 100
    queries:
      - "agent reliability production failure"     # Agent 工程（保留为一组）
      - "learning in public deliberate practice"
      - "clear writing process"
      - "decision making changed my mind"
    urls: []
  github:
    # Add logins under `users`, then set enabled: true.
    enabled: false
    mode: query
    fetch_limit: 100
    users: []  # GitHub logins only, e.g. [jackwener, iFurySt]
  v2ex:
    enabled: true
    mode: query
    fetch_limit: 100
    queries:
      - "AI Agent 实践"          # Agent 工程（保留为一组）
      - "独立创作 复盘"
      - "学习方法 实践"
      - "写作 修改过程"
      - "决策 反思"
  weixin:
    # 搜狗微信搜索（opencli weixin search）；`mode: url` 则按文章链接导入。
    enabled: true
    mode: query
    fetch_limit: 50
    queries:
      - "AI Agent 实践"          # Agent 工程（保留为一组）
      - "独立创作 复盘"
      - "学习方法 实践"
      - "写作 修改过程"
    urls: []
  xiaohongshu:
    enabled: true
    mode: query
    fetch_limit: 100
    queries:
      - "AI Agent 开发实践"      # Agent 工程（保留为一组）
      - "独立创作 复盘"
      - "学习方法 实践"
      - "决策 反思"
    urls: []

# Daily 50-person discovery: 5 priority / 15 summary / 30 browse tiers.
# LLM budget is fixed: at most `semantic_assess_limit` people enter batch semantic
# assessment, and `deep_prepare_limit` people get a full connection analysis —
# regardless of how large the candidate pool grows.
discovery:
  lookback_hours: 720       # 证据窗口：30 天；--lookback 可临时覆盖
  freshness_boost_hours: 72  # 72 小时内加权
  nominate_limit: 10         # 确定性提名上限（P3 生效；本轮先作为计划字段）
  daily_people:
    target: 50
    priority_count: 5
    summary_count: 15
    browse_count: 30
    candidate_pool_size: 100
    semantic_assess_limit: 20
    deep_prepare_limit: 5
    max_per_platform: 20
    min_artifacts_priority: 2
    cooldown_days: 7

twitter:
  daily_limit: 100
  per_query_limit: 20
  queries:
    - id: agent_harness_live
      text: '"agent harness" OR "agent loop"'
      filter: live
      priority: 5
    - id: agent_eval_live
      text: '"agent evals" OR "trajectory evaluation"'
      filter: live
      priority: 5
    - id: context_engineering
      text: '"context engineering" agent'
      filter: live
      priority: 4
    - id: tool_failure
      text: '"tool calling" failure agent'
      filter: live
      priority: 4
    - id: indie_maker_lessons
      text: '("indie maker" OR bootstrapped) (lessons OR mistakes)'
      filter: live
      priority: 4
    - id: learning_in_public
      text: '"learning in public" OR "deliberate practice"'
      filter: live
      priority: 4
    - id: writing_process
      text: '"writing process" OR "clear writing"'
      filter: live
      priority: 3
    - id: decision_review
      text: '"decision making" OR "changed my mind"'
      filter: live
      priority: 3
  high_value_authors: []
  blocked_authors: []

quality_gates:
  min_quality_score: 0.75
  max_rewrite_rounds: 2

engagement:
  enabled: true
  schedule: every_run
  platforms: [x, reddit]
  max_posts_scanned: 30
  search_concurrency: 4
  min_candidate_score: 0.72
  max_bookmarks: 5
  max_reply_drafts: 10
  max_public_replies: 2
  per_author_daily_limit: 1
  max_discovery_authors: 50
  max_semantic_authors: 20
  max_display_opportunities: 10
  snapshot_ttl_hours: 24
  public_expression_requires_approval: true

interests:
  long_term_interests:
    - agent reliability        # Agent 工程（保留为一组）
    - agent evals
    - independent creation
    - product practice
    - learning methods
    - clear writing
    - decision review
    - long-term collaboration
    - attention and work style
  current_questions: []
  explore_directions:
    - durable execution        # Agent 工程（保留为一组）
    - failure replay
    - independent creation
    - learning in public
    - clear writing
    - decision review
  adjacent_queries:
    - bootstrapping
    - deliberate practice
    - writing process
    - changed my mind
  # 按「形式」排除低价值内容，不按「主题」一刀切（Agent/AI 话题不再整体排除）。
  excluded_content:
    - 重复宣传
    - 无新增信息
    - evidence-free model rankings

  # 存在非空 practice-profile.yaml 时忽略此项（community-scout 改读画像中 confirmed 条目的 evidence_refs）。
  practice_refs:
    - flingjie/Finch
    - flingjie/FDE-Gym
    - flingjie/builderDNA
    - flingjie/skills

# api_key is read from LLM_API_KEY in .env; do not commit secrets here.
llm:
  base_url: https://your-llm-gateway.example.com/v1
  model: your-model-name
  nodes:
    critique:
      model: your-model-name
      timeout_seconds: 300
      max_output_tokens: 4096

extraction:
  max_prompt_bytes: 50000
  max_groups_per_batch: 12
  max_concurrent_batches: 2
  global_max_concurrency: 4
  timeout_seconds: 180
  max_commits_per_group_prompt: 15
  max_group_prompt_bytes: 25000
