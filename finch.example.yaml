# Finch example configuration.
#
# Copy this file to `finch.yaml` and adjust it for your setup. `finch.yaml` is
# git-ignored so local credentials and repository lists are not committed.

# List explicit repositories as `owner/name`. Leave empty to use repository_discovery.
# repositories:
#   - your-org/your-repo
#   - your-org/another-repo
repositories: []

repository_discovery:
  enabled: true
  lookback_hours: 24
  max_repos: 10

opencli:
  profile: work
  format: json
  command_timeout_seconds: 60
  browser_connect_timeout_seconds: 45
  max_parallel_local: 3
  max_parallel_browser: 1
  allow_write_commands: false

# Per-source discovery queries for `connect daily --refresh` / `sources sync --all`.
# Each source is explicit: `enabled` + `mode` (query | hot | url | disabled).
# An `enabled: true` source with `mode: query`/`url` but no queries/urls is a
# CONFIG_ERROR (never silently skipped). Do NOT reuse one topic query for GitHub
# (users are logins, not themes).
sources:
  twitter:
    enabled: true
    mode: query
    fetch_limit: 200
    recommendation_cap: 20
    queries:
      - '"agent reliability" OR "agent evals"'
      - '"agent harness" OR "context engineering"'
      - '"durable execution" OR "failure replay"'
    urls: []
  reddit:
    enabled: true
    mode: query
    fetch_limit: 100
    recommendation_cap: 8
    queries:
      - "agent reliability production failure"
      - "LLM agent evaluation real world"
    urls: []
  github:
    # Add logins under `users`, then set enabled: true.
    enabled: false
    mode: query
    fetch_limit: 100
    recommendation_cap: 15
    users: []  # GitHub logins only, e.g. [jackwener, iFurySt]
  v2ex:
    enabled: true
    mode: query
    fetch_limit: 100
    recommendation_cap: 12
    queries:
      - "AI Agent 实践"
      - "大模型 应用 落地"
  weixin:
    # 搜狗微信搜索（opencli weixin search）；`mode: url` 则按文章链接导入。
    enabled: true
    mode: query
    fetch_limit: 50
    recommendation_cap: 8
    queries:
      - "AI Agent 实践"
      - "大模型 应用 落地"
    urls: []
  xiaohongshu:
    enabled: true
    mode: query
    fetch_limit: 100
    recommendation_cap: 12
    queries:
      - "AI Agent 开发实践"
      - "AI 工作流 复盘"
    urls: []

# Daily 50-person discovery: 5 priority / 15 summary / 30 browse tiers.
# LLM budget is fixed: at most `semantic_assess_limit` people enter batch semantic
# assessment, and `deep_prepare_limit` people get a full connection analysis —
# regardless of how large the candidate pool grows.
discovery:
  lookback_hours: 720       # 证据窗口：30 天；--lookback 可临时覆盖
  freshness_boost_hours: 72  # 72 小时内加权
  nominate_limit: 10         # 确定性提名上限（P3 生效；本轮先作为计划字段）
  daily_people:
    target: 50
    priority_count: 5
    summary_count: 15
    browse_count: 30
    candidate_pool_size: 100
    semantic_assess_limit: 20
    deep_prepare_limit: 5
    max_per_platform: 20
    min_chinese_platforms_total: 15
    min_artifacts_priority: 2
    cooldown_days: 7

twitter:
  daily_limit: 100
  per_query_limit: 20
  queries:
    - id: agent_harness_live
      text: '"agent harness" OR "agent loop"'
      filter: live
      priority: 5
    - id: agent_eval_live
      text: '"agent evals" OR "trajectory evaluation"'
      filter: live
      priority: 5
    - id: context_engineering
      text: '"context engineering" agent'
      filter: live
      priority: 4
    - id: tool_failure
      text: '"tool calling" failure agent'
      filter: live
      priority: 4
  high_value_authors: []
  blocked_authors: []

quality_gates:
  min_quality_score: 0.75
  max_rewrite_rounds: 2

engagement:
  enabled: true
  schedule: every_run
  platforms: [x, reddit]
  max_posts_scanned: 30
  search_concurrency: 4
  min_candidate_score: 0.72
  max_bookmarks: 5
  max_reply_drafts: 10
  max_public_replies: 2
  per_author_daily_limit: 1
  max_discovery_authors: 50
  max_semantic_authors: 20
  max_display_opportunities: 10
  snapshot_ttl_hours: 24
  public_expression_requires_approval: true

interests:
  long_term_interests:
    - agent reliability
    - agent evals
    - graph engineering
    - agent harness
  current_questions: []
  explore_directions:
    - durable execution
    - failure replay
    - dynamic graph
    - production agent failures
  adjacent_queries:
    - checkpoint
    - compensation
  usage_queries:
    - "manual regression triage"
    - "how do you currently reconcile exports"
    - "workaround for flaky agent evals"
    - "spent all day copying between tools"
  excluded_content:
    - AI news
    - funding and valuation
    - evidence-free model rankings

# api_key is read from LLM_API_KEY in .env; do not commit secrets here.
llm:
  base_url: https://your-llm-gateway.example.com/v1
  model: your-model-name
  nodes:
    critique:
      model: your-model-name
      timeout_seconds: 300
      max_output_tokens: 4096

extraction:
  max_prompt_bytes: 50000
  max_groups_per_batch: 12
  max_concurrent_batches: 2
  global_max_concurrency: 4
  timeout_seconds: 180
  max_commits_per_group_prompt: 15
  max_group_prompt_bytes: 25000
