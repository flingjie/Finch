skill_name: peer-discovery
cases:
  - id: 1
    name: 真实问题产出一个同行候选
    input:
      topic: agent evals
      posts:
        - url: https://x.com/acme/status/1
          text: "Our agent keeps failing on long context, it's broken."
    expected_output:
      peers: 1
      source_post_url: https://x.com/acme/status/1
    assertions:
      - name: 单同行
        description: 产出恰好一个 PeerProfile 候选
      - name: 可追溯来源
        description: source_refs 保留帖子 URL，作者按 platform+author_id 归一化

  - id: 2
    name: 新闻产出空列表
    input:
      topic: agents
      posts:
        - url: https://x.com/acme/status/2
          text: "Acme launches v2 of their agent framework today."
    expected_output:
      peers: 0
    assertions:
      - name: 空结果
        description: 新闻/发布不产出同行候选（promotion_risk 高）

  - id: 3
    name: 融资产出空列表
    input:
      topic: agents
      posts:
        - url: https://x.com/acme/status/3
          text: "Acme raised a $50M series A at a $1B valuation."
    expected_output:
      peers: 0
    assertions:
      - name: 空结果
        description: 融资不产出同行候选

  - id: 4
    name: 纯情绪产出空列表
    input:
      topic: agents
      posts:
        - url: https://x.com/acme/status/4
          text: "This new framework is absolutely amazing and incredible."
    expected_output:
      peers: 0
    assertions:
      - name: 空结果
        description: 纯情绪/推广不产出同行候选

  - id: 5
    name: 外部亲历不写成用户亲历
    input:
      topic: agents
      posts:
        - url: https://x.com/acme/status/5
          text: "I spent 3 weeks debugging our agent and it still crashes."
    expected_output:
      peers: 1
      source_post_keeps_original: true
    assertions:
      - name: 保持外部来源
        description: 外部作者只是信号，不写成用户亲历；原文保留在 source_refs

  - id: 6
    name: 同一作者多帖聚合
    input:
      topic: agent evals
      posts:
        - url: https://x.com/acme/status/6
          text: "Our agent keeps failing on long context, it's broken."
        - url: https://x.com/acme/status/7
          text: "Reproduced it again with a longer prompt."
    expected_output:
      peers: 1
    assertions:
      - name: 聚合
        description: 同一作者多条帖子只产出一个 PeerProfile

  - id: 7
    name: 相同输入 → 相同结果
    input:
      topic: scheduling
      posts:
        - url: https://x.com/acme/status/8
          text: "The scheduler has a nasty race condition bug."
    expected_output:
      deterministic: true
    assertions:
      - name: 确定性
        description: 相同输入两次运行产出相同 peer id（platform+author_id 幂等）

  - id: 8
    name: 首选机会以具体反应问题收尾
    input:
      preferred_opportunity:
        topic: Agent 重试失败后结果不一致
        why_me: "[agent-100-days] 处理过调用超时，但没处理过重复执行后果"
        open_questions: ["未核对线程已有回复"]
    expected_output:
      closing_line_is_question: true
    assertions:
      - name: 具体问题
        description: 收尾是一个指向用户经历或分歧的具体问题（A 还是 B / 你那次怎么处理）
      - name: 禁止泛问
        description: 不以「你怎么看」「先做这个切口吗」「要不要做」收尾

  - id: 9
    name: 实质回答传入 --reaction
    input:
      user_reply: "我当时最难的是不知道任务到底跑没跑，后来加了幂等键才敢重试"
    expected_output:
      cli: "finch connect prepare --opportunity <id> --reaction \"我当时最难的是不知道任务到底跑没跑，后来加了幂等键才敢重试\""
    assertions:
      - name: 原话
        description: --reaction 传用户原话，不润色、不补全、不拆成多条

  - id: 10
    name: 不回答只得澄清问题
    input:
      user_reply: "先准备吧"
    expected_output:
      cli: "finch connect prepare --opportunity <id>"
      explains_clarifying_only: true
    assertions:
      - name: 不传反应
        description: 不传 --reaction；呈现时说明「没有你的反应，这次只准备了一个澄清问题」

  - id: 11
    name: 空首选不提反应问题
    input:
      preferred_opportunity: null
    expected_output:
      closing_line_is_question: false
    assertions:
      - name: 自然结束
        description: 说明为何无首选并保留可浏览线索，不硬凑反应问题
