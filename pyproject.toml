[project]
name = "finch"
version = "0.1.0"
description = "Evidence-driven builder companion: matches GitHub engineering evidence to public technical discussion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "sqlmodel>=0.0.16",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
finch = "finch.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# Alembic 迁移脚本由 autogenerate 生成，遵循 alembic 模板约定（Union/Sequence/单引号/长行），
# 不按本项目 ruff 规则 lint。
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
