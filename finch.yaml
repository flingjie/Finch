repositories: []

repository_discovery:
  enabled: true
  lookback_hours: 24
  max_repos: 10

twitter:
  daily_limit: 100
  per_query_limit: 20
  queries:
    - id: agent_harness_live
      text: '"agent harness" OR "agent loop"'
      filter: live
      priority: 5
    - id: agent_eval_live
      text: '"agent evals" OR "trajectory evaluation"'
      filter: live
      priority: 5
    - id: context_engineering
      text: '"context engineering" agent'
      filter: live
      priority: 4
    - id: tool_failure
      text: '"tool calling" failure agent'
      filter: live
      priority: 4
  high_value_authors: []
  blocked_authors: []

quality_gates:
  max_daily_replies: 5
  max_daily_original_posts: 1
  min_candidate_score: 0.65
  min_evidence_score: 0.75
  min_quality_score: 0.75
  min_discussability: 0.50
  max_rewrite_rounds: 2
  match_top_k: 10
  timing_default: 0.3
