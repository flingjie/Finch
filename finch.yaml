repositories: []

repository_discovery:
  enabled: true
  lookback_hours: 24
  max_repos: 10

twitter:
  daily_limit: 100
  per_query_limit: 20
  queries:
    - id: agent_harness_live
      text: '"agent harness" OR "agent loop"'
      filter: live
      priority: 5
    - id: agent_eval_live
      text: '"agent evals" OR "trajectory evaluation"'
      filter: live
      priority: 5
    - id: context_engineering
      text: '"context engineering" agent'
      filter: live
      priority: 4
    - id: tool_failure
      text: '"tool calling" failure agent'
      filter: live
      priority: 4
  high_value_authors: []
  blocked_authors: []

quality_gates:
  max_daily_replies: 5
  max_daily_original_posts: 1
  min_candidate_score: 0.65
  min_evidence_score: 0.75
  min_quality_score: 0.75
  min_discussability: 0.50
  max_rewrite_rounds: 2
  match_top_k: 10
  timing_default: 0.3

engagement:
  enabled: true
  schedule: every_run
  platforms: [x, reddit]
  max_posts_scanned: 30
  min_candidate_score: 0.72
  max_bookmarks: 5
  max_reply_drafts: 3
  max_public_replies: 2
  per_author_daily_limit: 1
  public_expression_requires_approval: true

interests:
  stable:
    - agent reliability
    - agent evals
    - graph engineering
    - agent harness
  exploring:
    - durable execution
    - failure replay
    - dynamic graph
    - production agent failures
  excluded:
    - AI 新闻搬运
    - 融资与估值
    - 无实践依据的模型排名

llm:
  base_url: https://model-gateway.shuwenda.icu/v1
  model: deepseek-v4-flash
  # api_key 从环境变量 LLM_API_KEY 读取（见 .env），不落盘到本文件
  nodes:
    plan_topics:
      model: deepseek-v4-flash
      timeout_seconds: 120
      max_output_tokens: 2000
    expand_job:
      model: deepseek-v4-flash
      timeout_seconds: 90
      max_output_tokens: 1200
      max_concurrency: 4
    critique:
      model: deepseek-v4-pro
      timeout_seconds: 300
      max_output_tokens: 4096

extraction:
  max_prompt_bytes: 50000
  max_groups_per_batch: 12
  max_concurrent_batches: 2
  timeout_seconds: 180
