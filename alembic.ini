[alembic]
# 迁移脚本目录（相对本文件）。
script_location = alembic

# 默认数据库 URL；可用 `alembic -x db_url=...` 或环境变量 FINCH_DB_URL 覆盖。
# 生产/本地库默认走 var/finch.db（与 Store.init 的 create_all 同一路径）。
sqlalchemy.url = sqlite:///var/finch.db

# 迁移命令示例（本仓库正式迁移路径，与 Store.init 的 create_all 并存）：
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "message"

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
